<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Werkstatt · 24 Briefe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..650,0..100,0..1;1,9..144,300..650,0..100,0..1&display=swap" rel="stylesheet">
<style>
  :root { --grund:#10291E; --feld:#173528; --hell:#F4EDDE; --hell-2:rgba(244,237,222,.7); --hell-3:rgba(244,237,222,.42); --linie:rgba(244,237,222,.14); --kerze:#F0C36B; --rot:#E0503A;
          --mono:"DM Mono",ui-monospace,monospace; --serif:"Fraunces",Georgia,serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--grund); color: var(--hell); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  .wrap { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { overflow-y: auto; padding: 22px 22px 40px; border-right: 1px solid var(--linie); background: var(--feld); }
  h1 { margin: 0 0 4px; font-weight: 340; font-size: 30px; font-variation-settings: "SOFT" 100, "opsz" 144; }
  h1 em { color: var(--kerze); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
  .unter { margin: 0 0 18px; color: var(--hell-3); font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  section { padding: 16px 0; border-top: 1px solid var(--linie); }
  .titel { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--hell-3); }
  .titel b { color: var(--kerze); font-weight: 500; letter-spacing: .04em; }
  input[type=range] { width: 100%; accent-color: var(--kerze); }
  .knoepfe { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--linie); background: rgba(244,237,222,.05); color: var(--hell); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
  button:hover { border-color: var(--hell-3); }
  button.an { background: var(--hell); color: var(--grund); border-color: var(--hell); }
  button.gross { width: 100%; border-radius: 10px; padding: 11px 14px; text-align: left; font-size: 16px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
  button.gross small { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--hell-3); text-transform: uppercase; }
  button.gross.akzent { background: var(--kerze); color: var(--grund); border-color: var(--kerze); }
  button.gross.akzent small { color: rgba(16,41,30,.6); }
  .tage { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .tage button { border-radius: 8px; padding: 8px 0; font-family: var(--mono); font-size: 12px; }
  .tipp { margin: 10px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--hell-2); font-weight: 340; }
  .tipp code { font-family: var(--mono); font-size: 11.5px; color: var(--kerze); }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow: hidden; position: relative; }
  .telefon { position: relative; border-radius: 46px; padding: 12px; background: #050806; box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 1.5px #2a2f2b; transform-origin: center center; }
  .telefon iframe { display: block; border: 0; border-radius: 35px; background: #15392A; }
  .adresse { margin-top: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--hell-3); max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adresse a { color: var(--hell-2); }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--linie); }
    main { padding: 16px 0 30px; }
    .telefon { padding: 0; border-radius: 0; background: none; box-shadow: none; }
    .telefon iframe { border-radius: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Werkstatt <em>24 Briefe</em></h1>
    <p class="unter">Alles durchklicken · nichts wird gespeichert</p>

    <section>
      <p class="titel"><span>Szene</span></p>
      <button class="gross" data-szene="kalender">Kalender <small>Startseite</small></button>
      <button class="gross" data-szene="einleitung">Einleitung <small>erster Besuch</small></button>
      <button class="gross" data-szene="brief24">Brief 24 + Finale <small>Heiligabend</small></button>
      <button class="gross akzent" data-szene="finale">Nur das Finale <small>Kranz</small></button>
      <button class="gross" data-szene="finaleWieder">Finale wiedersehen <small>ohne Ablauf</small></button>
    </section>

    <section>
      <p class="titel"><span>Brief öffnen</span><span>mit Siegel</span></p>
      <div class="tage" id="tage"></div>
    </section>

    <section>
      <p class="titel"><span>Datum</span><b id="datumLabel"></b></p>
      <input type="range" id="datum" min="0" max="32" step="1">
      <div class="knoepfe">
        <button data-tag="-6">vor Dez.</button><button data-tag="1">1.</button><button data-tag="6">6.</button><button data-tag="13">13.</button><button data-tag="20">20.</button><button data-tag="24">24.</button><button data-tag="27">nach Weihn.</button>
      </div>
    </section>

    <section>
      <p class="titel"><span>Schon gelesen</span><b id="gelesenLabel"></b></p>
      <input type="range" id="gelesen" min="0" max="24" step="1">
      <div class="knoepfe">
        <button data-gelesen="0">keine</button><button data-gelesen="gestern">bis gestern</button><button data-gelesen="heute">bis heute</button><button data-gelesen="24">alle</button>
      </div>
    </section>

    <section>
      <p class="titel"><span>Stil</span></p>
      <div class="knoepfe" id="stile"><button data-stil="tanne">Tannengrün</button><button data-stil="beere">Beerenrot</button></div>
      <p class="titel" style="margin-top:16px"><span>Gerät</span></p>
      <div class="knoepfe" id="geraete"><button data-geraet="390x844">iPhone 12</button><button data-geraet="375x667">iPhone SE</button><button data-geraet="430x932">iPhone Pro Max</button></div>
    </section>

    <section>
      <div class="knoepfe"><button id="neu">Neu laden</button><button id="tab">In eigenem Tab öffnen</button></div>
      <p class="tipp">Im Telefon tippen funktioniert wie bei Gioia. Gedichte änderst du in <code>gedichte.js</code> – danach hier „Neu laden“.</p>
    </section>
  </aside>
  <main>
    <div class="telefon" id="telefon"><iframe id="rahmen" title="Vorschau"></iframe></div>
    <p class="adresse" id="adresse"></p>
  </main>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const JAHR = 2026, START = new Date(JAHR, 10, 25); // 25. Nov.
  const zustand = { tagIndex: 16, gelesen: 10, stil: 'tanne', geraet: '390x844', szene: 'kalender', brief: null };
  const datumVon = i => { const d = new Date(START); d.setDate(d.getDate() + i); return d; };
  const indexVonTag = t => Math.round((new Date(JAHR, 11, t) - START) / 864e5);
  const tagImDez = () => { const d = datumVon(zustand.tagIndex); return d.getMonth() === 11 ? d.getDate() : (d < new Date(JAHR, 11, 1) ? 0 : 99); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  $('#tage').innerHTML = [...Array(24)].map((_, i) => `<button data-brief="${i + 1}">${i + 1}</button>`).join('');

  function adresse() {
    const p = new URLSearchParams();
    p.set('vorschau', ''); p.set('werkstatt', '');
    p.set('stil', zustand.stil);
    p.set('datum', iso(datumVon(zustand.tagIndex)));
    p.set('gelesen', zustand.gelesen);
    if (zustand.szene === 'einleitung') p.set('einleitung', '');
    if (zustand.szene === 'finale') p.set('finale', '');
    if (zustand.szene === 'finaleWieder') { p.set('finale', ''); p.set('finaleGesehen', ''); }
    if (zustand.brief) p.set('brief', zustand.brief);
    p.set('t', Date.now() % 100000);
    return 'index.html?' + p.toString().replace(/=(&|$)/g, '$1') + location.hash;
  }
  function anzeigen() {
    const d = datumVon(zustand.tagIndex);
    $('#datum').value = zustand.tagIndex;
    $('#datumLabel').textContent = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
    $('#gelesen').value = zustand.gelesen;
    $('#gelesenLabel').textContent = `${zustand.gelesen} von 24`;
    $$('#stile button').forEach(b => b.classList.toggle('an', b.dataset.stil === zustand.stil));
    $$('#geraete button').forEach(b => b.classList.toggle('an', b.dataset.geraet === zustand.geraet));
    $$('[data-szene]').forEach(b => b.classList.toggle('an', !zustand.brief && b.dataset.szene === zustand.szene && b.dataset.szene !== 'finale'));
    $$('#tage button').forEach(b => b.classList.toggle('an', +b.dataset.brief === zustand.brief));
  }
  function laden() {
    const url = adresse();
    $('#rahmen').src = url;
    $('#adresse').innerHTML = `<a href="${url}" target="_blank">${url.replace(/#.*/, '')}</a>`;
    anzeigen(); groesse();
  }
  function groesse() {
    const [w, h] = zustand.geraet.split('x').map(Number);
    const f = $('#rahmen'); f.width = w; f.height = h;
    const t = $('#telefon');
    if (innerWidth <= 820) { t.style.transform = ''; t.style.margin = ''; f.style.width = Math.min(w, innerWidth - 24) + 'px'; return; }
    f.style.width = '';
    const platz = $('main').clientHeight - 70, s = Math.min(1, platz / (h + 24), ($('main').clientWidth - 40) / (w + 24));
    t.style.transform = `scale(${s})`;
    t.style.margin = `${-(h + 24) * (1 - s) / 2}px ${-(w + 24) * (1 - s) / 2}px`;
  }
  addEventListener('resize', groesse);

  $('#datum').addEventListener('input', e => { zustand.tagIndex = +e.target.value; zustand.brief = null; zustand.szene = 'kalender'; anzeigen(); });
  $('#datum').addEventListener('change', laden);
  $('#gelesen').addEventListener('input', e => { zustand.gelesen = +e.target.value; zustand.brief = null; zustand.szene = 'kalender'; anzeigen(); });
  $('#gelesen').addEventListener('change', laden);
  $$('[data-tag]').forEach(b => b.onclick = () => { const t = +b.dataset.tag; zustand.tagIndex = t < 0 ? 0 : Math.min(32, indexVonTag(t)); zustand.brief = null; zustand.szene = 'kalender'; laden(); });
  $$('[data-gelesen]').forEach(b => b.onclick = () => {
    const v = b.dataset.gelesen, heute = Math.min(24, tagImDez());
    zustand.gelesen = v === 'gestern' ? Math.max(0, heute - 1) : v === 'heute' ? heute : +v;
    zustand.brief = null; zustand.szene = 'kalender'; laden();
  });
  $$('[data-stil]').forEach(b => b.onclick = () => { zustand.stil = b.dataset.stil; laden(); });
  $$('[data-geraet]').forEach(b => b.onclick = () => { zustand.geraet = b.dataset.geraet; laden(); });
  $$('[data-brief]').forEach(b => b.onclick = () => {
    const n = +b.dataset.brief;
    zustand.brief = n; zustand.szene = 'kalender';
    zustand.gelesen = n - 1;
    if (tagImDez() < n || tagImDez() === 99) zustand.tagIndex = indexVonTag(n);
    laden();
  });
  $$('[data-szene]').forEach(b => b.onclick = () => {
    const s = b.dataset.szene; zustand.brief = null; zustand.szene = s;
    if (s === 'einleitung') { zustand.gelesen = 0; }
    if (s === 'brief24') { zustand.szene = 'kalender'; zustand.brief = 24; zustand.gelesen = 23; zustand.tagIndex = indexVonTag(24); }
    if (s === 'finale' || s === 'finaleWieder') { zustand.gelesen = 24; zustand.tagIndex = indexVonTag(24); }
    laden();
  });
  $('#neu').onclick = laden;
  $('#tab').onclick = () => open(adresse(), '_blank');
  laden();
})();
</script>
</body>
</html>
